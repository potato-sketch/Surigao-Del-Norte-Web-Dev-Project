<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NatureTrails — Auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="landing.css" />
  </head>
  <body>
    <div class="success-popup" id="successPopup">
      <div class="success-box">
        <img src="/success.png" alt="Success" class="success-icon" />
        <h3 id="successTitle"></h3>
        <p id="successMessage"></p>
        <button class="pxbtn pxbtn-green" onclick="closeSuccessPopup()">
          OK
        </button>
      </div>
    </div>

    <div class="scene">
      <div class="sun" id="sun"></div>
      <div id="cloudContainer"></div>
      <div class="trees" id="trees"></div>
      <div class="grass-strip"></div>
      <div class="grass"></div>

      <div
        class="flower"
        style="bottom: 14%; left: 8%; animation-delay: 0s"
      ></div>
      <div
        class="flower"
        style="bottom: 13%; left: 20%; animation-delay: 0.5s"
      ></div>
      <div
        class="flower"
        style="bottom: 14%; left: 36%; animation-delay: 1s"
      ></div>
      <div
        class="flower"
        style="bottom: 13%; right: 20%; animation-delay: 1.5s"
      ></div>
      <div class="flower" style="bottom: 14%; right: 8%; animation-delay: 0.8s">
        🌸
      </div>
      <!-- Butterflies -->
      <div class="butterfly" style="top: 30%; left: 9%; animation-delay: 0s">
        🦋
      </div>
      <div class="butterfly" style="top: 26%; right: 14%; animation-delay: 1s">
        🦋
      </div>
    </div>

    <div class="stage">
      <div class="landing-auth-card" id="authModal">
        <!-- Accent top bar -->
        <div class="modal-accent-bar" id="accentBar"></div>

        <!-- Header -->
        <div class="modal-hdr" id="modalHdr">
          <div class="modal-hdr-title" id="modalTitle">SIGN IN</div>
          <div class="modal-hdr-sub" id="modalSub">
            Welcome back, adventurer!
          </div>
        </div>

        <!-- Tabs -->
        <div class="tab-row">
          <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">
            SIGN IN
          </button>
          <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">
            SIGN UP
          </button>
        </div>

        <!-- Login form -->
        <div class="modal-form" id="formLogin">
          <div class="field">
            <label>EMAIL</label>
            <div class="input-wrap">
              <input
                type="email"
                placeholder="juandelacruz@gmail.com"
                id="loginEmail"
              />
            </div>
            <div id="loginEmailError" class="field-error"></div>
          </div>
          <div class="field">
            <label>PASSWORD</label>
            <div class="input-wrap">
              <input type="password" placeholder="••••••••" id="loginPw" />
              <button
                type="button"
                class="eye-btn"
                onclick="togglePw('loginPw', this)"
              >
                <img
                  src="/eye-closed.png"
                  alt="Show Password"
                  class="eye-icon"
                />
              </button>
            </div>
            <div id="loginPwError" class="field-error"></div>
          </div>
          <button class="forgot-btn">FORGOT PASSWORD?</button>
          <button
            class="pxbtn pxbtn-green"
            style="width: 100%"
            onclick="login()"
          >
            SIGN IN
          </button>
          <div class="px-divider">
            <div class="px-div-line"></div>
            <div class="px-div-line"></div>
          </div>
          <a href="index.html" class="auth-back-link" onclick="return navigateBackToMainScene(event)">← BACK TO MAIN MENU</a>
        </div>

        <!-- Signup form -->
        <div class="modal-form" id="formSignup" style="display: none">
          <div class="field">
            <label>FULL NAME</label>
            <div class="input-wrap">
              <input type="text" id="signupName" placeholder="Juan Dela Cruz" />
            </div>
            <div id="signupNameError" class="field-error"></div>
          </div>
          <div class="field">
            <label>EMAIL</label>
            <div class="input-wrap">
              <input
                type="email"
                id="signupEmail"
                placeholder="juandelacruz@gmail.com"
              />
            </div>
            <div id="signupEmailError" class="field-error"></div>
          </div>
          <div class="field">
            <label>PASSWORD</label>
            <div class="input-wrap">
              <input type="password" placeholder="••••••••" id="signupPw" />
              <button
                type="button"
                class="eye-btn"
                onclick="togglePw('signupPw', this)"
              >
                <img
                  src="/eye-closed.png"
                  alt="Show Password"
                  class="eye-icon"
                />
              </button>
            </div>
            <div id="signupPwError" class="field-error"></div>
          </div>
          <div class="field">
            <label>CONFIRM PASSWORD</label>
            <div class="input-wrap">
              <input type="password" placeholder="••••••••" id="confirmPw" />
              <button
                type="button"
                class="eye-btn"
                onclick="togglePw('confirmPw', this)"
              >
                <img
                  src="/eye-closed.png"
                  alt="Show Password"
                  class="eye-icon"
                />
              </button>
            </div>
            <div id="confirmPwError" class="field-error"></div>
          </div>
          <p class="terms">
            By signing up you agree to our <a href="#">Terms</a> and
            <a href="#">Privacy Policy</a>.
          </p>
          <button
            class="pxbtn"
            style="
              width: 100%;
              background: #7a5230;
              color: #fff;
              outline-color: #3a1a08;
              box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.3);
            "
            onclick="signup()"
          >
            CREATE ACCOUNT
          </button>
          <div class="px-divider">
            <div class="px-div-line"></div>
            <div class="px-div-line"></div>
          </div>
          <a href="index.html" class="auth-back-link" onclick="return navigateBackToMainScene(event)">← BACK TO MAIN MENU</a>
        </div>

        <!-- Bottom pixel strip -->
        <div class="modal-footer-strip"></div>
      </div>
    </div>

    <script src="/music-manager.js"></script>
    <script>
      // ── Modal state ───────────────────────────────────────────────────────────────
      let currentTab = "login";

      const LOGIN_THEME = {
        bar: "#3d9142",
        barBorder: "#1e5c24",
        hdr: "#3d9142",
        hdrBorder: "#1e5c24",
      };
      const SIGNUP_THEME = {
        bar: "#f0c030",
        barBorder: "#7a5230",
        hdr: "#7a5230",
        hdrBorder: "#3a1a08",
      };
      const pageTransitionMs = 420;
      let pageTransitionInProgress = false;

      function applyTheme(tab) {
        const th = tab === "login" ? LOGIN_THEME : SIGNUP_THEME;
        const bar = document.querySelector(".modal-accent-bar");
        bar.style.background = th.bar;
        bar.style.borderBottomColor = th.barBorder;
        const hdr = document.getElementById("modalHdr");
        hdr.style.background = th.hdr;
        hdr.style.borderBottomColor = th.hdrBorder;
      }

      function openModal(tab) {
        switchTab(tab);
      }

      function isSignedIn() {
        return Boolean(localStorage.getItem("user_id"));
      }

      function handleExploreTours(event) {
        if (isSignedIn()) {
          return navigateWithTransition(event, "tours.html");
        }

        if (event) event.preventDefault();
        openModal("login");
        showSuccessPopup(
          "Sign In Required",
          "Please sign in first before exploring tours.",
        );
        return false;
      }

      function navigateWithTransition(event, url) {
        if (event) event.preventDefault();
        if (pageTransitionInProgress) return false;

        pageTransitionInProgress = true;
        document.body.classList.add("page-exiting");

        window.setTimeout(() => {
          window.location.href = url;
        }, pageTransitionMs);

        return false;
      }

      function navigateBackToMainScene(event) {
        sessionStorage.setItem("skipMainLoadingOnce", "1");
        return navigateWithTransition(event, "index.html");
      }

      function switchTab(tab) {
        currentTab = tab;
        const isLogin = tab === "login";

        // Toggle forms
        document.getElementById("formLogin").style.display = isLogin
          ? "flex"
          : "none";
        document.getElementById("formSignup").style.display = isLogin
          ? "none"
          : "flex";

        // Tab button styles
        const tl = document.getElementById("tabLogin");
        const ts = document.getElementById("tabSignup");

        tl.style.background = isLogin ? "#3d9142" : "transparent";
        tl.style.color = isLogin ? "#fff" : "#5a7a5a";
        tl.style.outline = isLogin ? "2px solid #1e5c24" : "none";
        tl.style.boxShadow = isLogin ? "2px 2px 0 rgba(0,0,0,.3)" : "none";

        ts.style.background = !isLogin ? "#7a5230" : "transparent";
        ts.style.color = !isLogin ? "#fff" : "#5a7a5a";
        ts.style.outline = !isLogin ? "2px solid #3a1a08" : "none";
        ts.style.boxShadow = !isLogin ? "2px 2px 0 rgba(0,0,0,.3)" : "none";

        // Header & accent bar
        document.getElementById("modalTitle").textContent = isLogin
          ? "SIGN IN"
          : "SIGN UP";
        document.getElementById("modalSub").textContent = isLogin
          ? "Welcome back, adventurer!"
          : "Join the wild today!";

        applyTheme(tab);
      }

      function togglePw(id, btn) {
        const input = document.getElementById(id);
        const img = btn.querySelector("img");

        if (input.type === "password") {
          // Show password
          input.type = "text";
          img.src = "/eye-open.png";
          img.alt = "Hide Password";
        } else {
          // Hide password
          input.type = "password";
          img.src = "/eye-closed.png";
          img.alt = "Show Password";
        }
      }

      // Init
      const urlParams = new URLSearchParams(window.location.search);
      const forcedSignedOut = urlParams.get("signedout") === "1";

      window.musicManager?.mountControls({ defaultTrack: "lofi" });

      switchTab("login");
      if (isSignedIn() && !forcedSignedOut) {
        navigateWithTransition(null, "tours.html");
      }

      async function signup() {
        document.querySelectorAll(".field-error").forEach((el) => {
          el.textContent = "";
          el.style.display = "none";
        });

        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const password = document.getElementById("signupPw").value;
        const confirm = document.getElementById("confirmPw").value;

        let hasError = false;

        if (!name) {
          document.getElementById("signupNameError").textContent =
            "Full name is required";
          document.getElementById("signupNameError").style.display = "flex";
          hasError = true;
        }

        if (!email) {
          document.getElementById("signupEmailError").textContent =
            "Email is required";
          document.getElementById("signupEmailError").style.display = "flex";
          hasError = true;
        }

        if (!password) {
          document.getElementById("signupPwError").textContent =
            "Password is required";
          document.getElementById("signupPwError").style.display = "flex";
          hasError = true;
        }

        if (!confirm) {
          document.getElementById("confirmPwError").textContent =
            "Confirm password is required";
          document.getElementById("confirmPwError").style.display = "flex";
          hasError = true;
        }

        if (hasError) return;

        if (password !== confirm) {
          document.getElementById("confirmPwError").textContent =
            "Passwords do not match";
          document.getElementById("confirmPwError").style.display = "flex";
          return;
        }

        try {
          const res = await fetch("api/signup.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: new URLSearchParams({
              full_name: name,
              email,
              password,
            }),
          });

          const raw = await res.text();
          let data = null;

          try {
            data = JSON.parse(raw);
          } catch {
            data = {
              success: false,
              message: "Server returned an invalid response.",
            };
          }

          if (!res.ok) {
            data.success = false;
            data.message = data.message || "Unable to sign up right now.";
          }

          if (data.success) {
            showSuccessPopup(
              "Account Created!",
              data.message || "Your account has been created successfully.",
              () => {
                switchTab("login");
              },
            );
          } else {
            const emailError = document.getElementById("signupEmailError");
            emailError.textContent = data.message || "Could not create account.";
            emailError.style.display = "flex";
          }
        } catch {
          const emailError = document.getElementById("signupEmailError");
          emailError.textContent = "Could not connect to the server.";
          emailError.style.display = "flex";
        }
      }

      document.getElementById("confirmPw").addEventListener("input", () => {
        document.getElementById("confirmPw").classList.remove("error");

        document.getElementById("confirmPwError").style.display = "none";
      });

      document.getElementById("loginPw").addEventListener("input", () => {
        document
          .getElementById("loginPw")
          .closest(".input-wrap")
          .classList.remove("error");
        document.getElementById("loginPwError").style.display = "none";
      });

      async function login() {
        document.getElementById("loginEmailError").style.display = "none";
        document.getElementById("loginPwError").style.display = "none";

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPw").value;

        let hasError = false;

        if (!email) {
          document.getElementById("loginEmailError").textContent =
            "Email is required";
          document.getElementById("loginEmailError").style.display = "flex";
          hasError = true;
        }

        if (!password) {
          document.getElementById("loginPwError").textContent =
            "Password is required";
          document.getElementById("loginPwError").style.display = "flex";
          hasError = true;
        }

        if (hasError) return;

        try {
          const res = await fetch("api/login.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: new URLSearchParams({
              email,
              password,
            }),
          });

          const raw = await res.text();
          let data = null;

          try {
            data = JSON.parse(raw);
          } catch {
            data = {
              success: false,
              message: "Server returned an invalid response.",
            };
          }

          if (!res.ok) {
            data.success = false;
            data.message = data.message || "Unable to sign in right now.";
          }

          if (data.success) {
            localStorage.setItem("user_id", data.user_id);
            localStorage.setItem("full_name", data.full_name);

            showSuccessPopup(
              "Login Successful!",
              `Welcome back, ${data.full_name}!`,
              () => {
                navigateWithTransition(null, "tours.html");
              },
            );
          } else {
            const pwError = document.getElementById("loginPwError");
            pwError.textContent = data.message || "Invalid credentials.";
            pwError.style.display = "flex";
          }
        } catch {
          const pwError = document.getElementById("loginPwError");
          pwError.textContent = "Could not connect to the server.";
          pwError.style.display = "flex";
        }
      }

      [
        "loginEmail",
        "loginPw",
        "signupName",
        "signupEmail",
        "signupPw",
        "confirmPw",
      ].forEach((id) => {
        const input = document.getElementById(id);

        if (!input) return;

        input.addEventListener("input", () => {
          const error = document.getElementById(id + "Error");

          if (error) {
            error.textContent = "";
            error.style.display = "none";
          }
        });
      });

      let successCallback = null;

      function showSuccessPopup(title, message, callback = null) {
        document.getElementById("successTitle").textContent = title;
        document.getElementById("successMessage").textContent = message;

        successCallback = callback;

        document.getElementById("successPopup").classList.add("show");
      }

      function closeSuccessPopup() {
        document.getElementById("successPopup").classList.remove("show");

        if (successCallback) {
          successCallback();
          successCallback = null;
        }
      }
    </script>
  </body>
</html>
