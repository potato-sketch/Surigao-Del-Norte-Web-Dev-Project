<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NatureTrails — Auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="landing.css" />
  </head>
  <div class="success-popup" id="successPopup">
    <div class="success-box">
      <img src="public/success.png" alt="Success" class="success-icon" />
      <h3 id="successTitle"></h3>
      <p id="successMessage"></p>
      <button class="pxbtn pxbtn-green" onclick="closeSuccessPopup()">
        OK
      </button>
    </div>
  </div>
  <body>
    <div class="scene">
      <div class="sun" id="sun"></div>
      <div id="cloudContainer"></div>
      <div class="trees" id="trees"></div>
      <div class="grass-strip"></div>
      <div class="grass"></div>

      <div
        class="flower"
        style="bottom: 14%; left: 8%; animation-delay: 0s"
      ></div>
      <div
        class="flower"
        style="bottom: 13%; left: 20%; animation-delay: 0.5s"
      ></div>
      <div
        class="flower"
        style="bottom: 14%; left: 36%; animation-delay: 1s"
      ></div>
      <div
        class="flower"
        style="bottom: 13%; right: 20%; animation-delay: 1.5s"
      ></div>
      <div class="flower" style="bottom: 14%; right: 8%; animation-delay: 0.8s">
        🌸
      </div>
      <!-- Butterflies -->
      <div class="butterfly" style="top: 30%; left: 9%; animation-delay: 0s">
        🦋
      </div>
      <div class="butterfly" style="top: 26%; right: 14%; animation-delay: 1s">
        🦋
      </div>
    </div>

    <!-- STAGE -->
    <div class="stage">
      <div class="btn-row">
        <a href="index.html" class="pxbtn pxbtn-white">← BACK</a>
        <button class="pxbtn pxbtn-green" onclick="openModal('signup')">
          GET STARTED
        </button>
        <a href="tours.html" class="pxbtn pxbtn-white" onclick="return handleExploreTours(event)">EXPLORE TOURS</a>
      </div>
    </div>

    <!-- AUTH MODAL -->
    <div class="modal-bd" id="modalBd" onclick="handleBdClick(event)">
      <div class="modal" id="authModal">
        <!-- Accent top bar -->
        <div class="modal-accent-bar" id="accentBar"></div>

        <!-- Header -->
        <div class="modal-hdr" id="modalHdr">
          <div class="modal-hdr-title" id="modalTitle">SIGN IN</div>
          <div class="modal-hdr-sub" id="modalSub">
            Welcome back, adventurer!
          </div>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>

        <!-- Tabs -->
        <div class="tab-row">
          <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">
            SIGN IN
          </button>
          <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">
            SIGN UP
          </button>
        </div>

        <!-- Login form -->
        <div class="modal-form" id="formLogin">
          <div class="field">
            <label>EMAIL</label>
            <div class="input-wrap">
              <input
                type="email"
                placeholder="juandelacruz@gmail.com"
                id="loginEmail"
              />
            </div>
            <div id="loginEmailError" class="field-error"></div>
          </div>
          <div class="field">
            <label>PASSWORD</label>
            <div class="input-wrap">
              <input type="password" placeholder="••••••••" id="loginPw" />
              <button
                type="button"
                class="eye-btn"
                onclick="togglePw('loginPw', this)"
              >
                <img
                  src="public/eye-closed.png"
                  alt="Show Password"
                  class="eye-icon"
                />
              </button>
            </div>
            <div id="loginPwError" class="field-error"></div>
          </div>
          <button class="forgot-btn">FORGOT PASSWORD?</button>
          <button
            class="pxbtn pxbtn-green"
            style="width: 100%"
            onclick="login()"
          >
            SIGN IN
          </button>
          <div class="px-divider">
            <div class="px-div-line"></div>
            <span class="px-div-text">OR CONTINUE WITH</span>
            <div class="px-div-line"></div>
          </div>
          <div class="social-row" id="socialLogin"></div>
        </div>

        <!-- Signup form -->
        <div class="modal-form" id="formSignup" style="display: none">
          <div class="field">
            <label>FULL NAME</label>
            <div class="input-wrap">
              <input type="text" id="signupName" placeholder="Juan Dela Cruz" />
            </div>
            <div id="signupNameError" class="field-error"></div>
          </div>
          <div class="field">
            <label>EMAIL</label>
            <div class="input-wrap">
              <input
                type="email"
                id="signupEmail"
                placeholder="juandelacruz@gmail.com"
              />
            </div>
            <div id="signupEmailError" class="field-error"></div>
          </div>
          <div class="field">
            <label>PASSWORD</label>
            <div class="input-wrap">
              <input type="password" placeholder="••••••••" id="signupPw" />
              <button
                type="button"
                class="eye-btn"
                onclick="togglePw('signupPw', this)"
              >
                <img
                  src="public/eye-closed.png"
                  alt="Show Password"
                  class="eye-icon"
                />
              </button>
            </div>
            <div id="signupPwError" class="field-error"></div>
          </div>
          <div class="field">
            <label>CONFIRM PASSWORD</label>
            <div class="input-wrap">
              <input type="password" placeholder="••••••••" id="confirmPw" />
              <button
                type="button"
                class="eye-btn"
                onclick="togglePw('confirmPw', this)"
              >
                <img
                  src="public/eye-closed.png"
                  alt="Show Password"
                  class="eye-icon"
                />
              </button>
            </div>
            <div id="confirmPwError" class="field-error"></div>
          </div>
          <p class="terms">
            By signing up you agree to our <a href="#">Terms</a> and
            <a href="#">Privacy Policy</a>.
          </p>
          <button
            class="pxbtn"
            style="
              width: 100%;
              background: #7a5230;
              color: #fff;
              outline-color: #3a1a08;
              box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.3);
            "
            onclick="signup()"
          >
            CREATE ACCOUNT
          </button>
          <div class="px-divider">
            <div class="px-div-line"></div>
            <span class="px-div-text">OR CONTINUE WITH</span>
            <div class="px-div-line"></div>
          </div>
          <div class="social-row" id="socialSignup"></div>
        </div>

        <!-- Bottom pixel strip -->
        <div class="modal-footer-strip"></div>
      </div>
    </div>

    <script>
      const socialHTML = `
        <button class="social-btn" aria-label="Google">
          <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        </button>`;

      document.getElementById("socialLogin").innerHTML = socialHTML;
      document.getElementById("socialSignup").innerHTML = socialHTML;

      // ── Modal state ───────────────────────────────────────────────────────────────
      let currentTab = "login";

      const LOGIN_THEME = {
        bar: "#3d9142",
        barBorder: "#1e5c24",
        hdr: "#3d9142",
        hdrBorder: "#1e5c24",
      };
      const SIGNUP_THEME = {
        bar: "#f0c030",
        barBorder: "#7a5230",
        hdr: "#7a5230",
        hdrBorder: "#3a1a08",
      };

      function applyTheme(tab) {
        const th = tab === "login" ? LOGIN_THEME : SIGNUP_THEME;
        const bar = document.querySelector(".modal-accent-bar");
        bar.style.background = th.bar;
        bar.style.borderBottomColor = th.barBorder;
        const hdr = document.getElementById("modalHdr");
        hdr.style.background = th.hdr;
        hdr.style.borderBottomColor = th.hdrBorder;
      }

      function openModal(tab) {
        switchTab(tab);
        document.getElementById("modalBd").classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function isSignedIn() {
        return Boolean(localStorage.getItem("user_id"));
      }

      function handleExploreTours(event) {
        if (isSignedIn()) return true;

        if (event) event.preventDefault();
        openModal("login");
        showSuccessPopup(
          "Sign In Required",
          "Please sign in first before exploring tours.",
        );
        return false;
      }

      function closeModal() {
        document.getElementById("modalBd").classList.remove("open");
        document.body.style.overflow = "";
      }

      function handleBdClick(e) {
        if (e.target === document.getElementById("modalBd")) closeModal();
      }

      function switchTab(tab) {
        currentTab = tab;
        const isLogin = tab === "login";

        // Toggle forms
        document.getElementById("formLogin").style.display = isLogin
          ? "flex"
          : "none";
        document.getElementById("formSignup").style.display = isLogin
          ? "none"
          : "flex";

        // Tab button styles
        const tl = document.getElementById("tabLogin");
        const ts = document.getElementById("tabSignup");

        tl.style.background = isLogin ? "#3d9142" : "transparent";
        tl.style.color = isLogin ? "#fff" : "#5a7a5a";
        tl.style.outline = isLogin ? "2px solid #1e5c24" : "none";
        tl.style.boxShadow = isLogin ? "2px 2px 0 rgba(0,0,0,.3)" : "none";

        ts.style.background = !isLogin ? "#7a5230" : "transparent";
        ts.style.color = !isLogin ? "#fff" : "#5a7a5a";
        ts.style.outline = !isLogin ? "2px solid #3a1a08" : "none";
        ts.style.boxShadow = !isLogin ? "2px 2px 0 rgba(0,0,0,.3)" : "none";

        // Header & accent bar
        document.getElementById("modalTitle").textContent = isLogin
          ? "SIGN IN"
          : "SIGN UP";
        document.getElementById("modalSub").textContent = isLogin
          ? "Welcome back, adventurer!"
          : "Join the wild today!";

        applyTheme(tab);
      }

      function togglePw(id, btn) {
        const input = document.getElementById(id);
        const img = btn.querySelector("img");

        if (input.type === "password") {
          // Show password
          input.type = "text";
          img.src = "public/eye-open.png";
          img.alt = "Hide Password";
        } else {
          // Hide password
          input.type = "password";
          img.src = "public/eye-closed.png";
          img.alt = "Show Password";
        }
      }

      // Init
      switchTab("login");
      if (!isSignedIn()) {
        openModal("login");
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      async function signup() {
        document.querySelectorAll(".field-error").forEach((el) => {
          el.textContent = "";
          el.style.display = "none";
        });

        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const password = document.getElementById("signupPw").value;
        const confirm = document.getElementById("confirmPw").value;

        let hasError = false;

        if (!name) {
          document.getElementById("signupNameError").textContent =
            "Full name is required";
          document.getElementById("signupNameError").style.display = "block";
          hasError = true;
        }

        if (!email) {
          document.getElementById("signupEmailError").textContent =
            "Email is required";
          document.getElementById("signupEmailError").style.display = "block";
          hasError = true;
        }

        if (!password) {
          document.getElementById("signupPwError").textContent =
            "Password is required";
          document.getElementById("signupPwError").style.display = "block";
          hasError = true;
        }

        if (!confirm) {
          document.getElementById("confirmPwError").textContent =
            "Confirm password is required";
          document.getElementById("confirmPwError").style.display = "block";
          hasError = true;
        }

        if (hasError) return;

        if (password !== confirm) {
          document.getElementById("confirmPwError").textContent =
            "Passwords do not match";
          document.getElementById("confirmPwError").style.display = "block";
          return;
        }

        const res = await fetch("api/signup.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
          },
          body: new URLSearchParams({
            full_name: name,
            email,
            password,
          }),
        });

        const data = await res.json();

        if (data.success) {
          showSuccessPopup(
            "Account Created!",
            "Your account has been created successfully.",
            () => {
              switchTab("login");
            },
          );
        } else {
          const pwWrap = document.getElementById("loginPw");
          pwWrap.classList.add("error");
        }
      }

      document.getElementById("confirmPw").addEventListener("input", () => {
        document.getElementById("confirmPw").classList.remove("error");

        document.getElementById("confirmPwError").style.display = "none";
      });

      document.getElementById("loginPw").addEventListener("input", () => {
        document
          .getElementById("loginPw")
          .closest(".input-wrap")
          .classList.remove("error");
        document.getElementById("loginPwError").style.display = "none";
      });

      async function login() {
        document.getElementById("loginEmailError").style.display = "none";
        document.getElementById("loginPwError").style.display = "none";

        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPw").value;

        let hasError = false;

        if (!email) {
          document.getElementById("loginEmailError").textContent =
            "Email is required";
          document.getElementById("loginEmailError").style.display = "block";
          hasError = true;
        }

        if (!password) {
          document.getElementById("loginPwError").textContent =
            "Password is required";
          document.getElementById("loginPwError").style.display = "block";
          hasError = true;
        }

        if (hasError) return;

        try {
          const res = await fetch("api/login.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: new URLSearchParams({
              email,
              password,
            }),
          });

          const raw = await res.text();
          let data = null;

          try {
            data = JSON.parse(raw);
          } catch {
            data = {
              success: false,
              message: "Server returned an invalid response.",
            };
          }

          if (!res.ok) {
            data.success = false;
            data.message = data.message || "Unable to sign in right now.";
          }

          if (data.success) {
            localStorage.setItem("user_id", data.user_id);
            localStorage.setItem("full_name", data.full_name);

            showSuccessPopup(
              "Login Successful!",
              `Welcome back, ${data.full_name}!`,
              () => {
                window.location.href = "tours.html";
              },
            );
          } else {
            const pwError = document.getElementById("loginPwError");
            pwError.textContent = data.message || "Invalid credentials.";
            pwError.style.display = "block";
          }
        } catch {
          const pwError = document.getElementById("loginPwError");
          pwError.textContent = "Could not connect to the server.";
          pwError.style.display = "block";
        }
      }

      [
        "loginEmail",
        "loginPw",
        "signupName",
        "signupEmail",
        "signupPw",
        "confirmPw",
      ].forEach((id) => {
        const input = document.getElementById(id);

        if (!input) return;

        input.addEventListener("input", () => {
          const error = document.getElementById(id + "Error");

          if (error) {
            error.textContent = "";
            error.style.display = "none";
          }
        });
      });

      let successCallback = null;

      function showSuccessPopup(title, message, callback = null) {
        document.getElementById("successTitle").textContent = title;
        document.getElementById("successMessage").textContent = message;

        successCallback = callback;

        document.getElementById("successPopup").classList.add("show");
      }

      function closeSuccessPopup() {
        document.getElementById("successPopup").classList.remove("show");

        if (successCallback) {
          successCallback();
          successCallback = null;
        }
      }
    </script>
  </body>
</html>
