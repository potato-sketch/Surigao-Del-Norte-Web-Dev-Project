<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Island Tour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="pre-render-active">
    <section id="mainScene" class="main-scene" aria-label="Main scene">
      <img
        class="main-scene-bg"
        src="/main_assets/background.png"
        alt="Surigao del Norte showcase background"
      />
      <img
        class="main-scene-desk"
        src="/main_assets/desk.png"
        alt=""
        aria-hidden="true"
      />
      <div class="main-scene-actions">
        <button
          id="showcase-btn"
          class="scene-btn showcase-btn"
          type="button"
          aria-label="Open 3D showcase"
        >
          <img
            class="scene-btn-img normal"
            src="/main_assets/showcase-btn.png"
            alt=""
            aria-hidden="true"
          />
          <img
            class="scene-btn-img hover"
            src="/main_assets/showcase-btn-hover.png"
            alt=""
            aria-hidden="true"
          />
        </button>
        <button
          id="booking-btn"
          class="scene-btn booking-btn"
          type="button"
          aria-label="Go to booking page"
        >
          <img
            class="scene-btn-img normal"
            src="/main_assets/booking-btn.png"
            alt=""
            aria-hidden="true"
          />
          <img
            class="scene-btn-img hover"
            src="/main_assets/booking-btn-hover.png"
            alt=""
            aria-hidden="true"
          />
        </button>
      </div>
    </section>

    <aside
      id="spotDetailsModal"
      class="spot-frame"
      aria-labelledby="spotDetailsModalLabel"
      aria-hidden="true"
    >
      <div class="spot-frame-header">
        <h5 class="spot-frame-title" id="spotDetailsModalLabel"></h5>
        <button
          id="spotDetailsClose"
          type="button"
          class="spot-frame-close"
          aria-label="Close"
        >
          ×
        </button>
      </div>
      <div class="spot-frame-body">
        <video
          id="spotDetailsVideo"
          class="w-100 rounded mb-3"
          controls
          loop
          playsinline
          preload="metadata"
        ></video>
        <p id="spotDetailsVideoFallback" class="small text-muted mb-3"></p>
        <p id="spotDetailsDescription" class="mb-0"></p>
      </div>
    </aside>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
